name: CI

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Lint
        run: npm run lint
      - name: Test
        run: |
          set +e
          npm run test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            err=$(tail -40 /tmp/test.log | tr '\n' '|' | cut -c1-1400)
            echo "::error file=src/test/setup.js::test exit=$code | $err"
            exit 1
          fi
      - name: Build
        run: npm run build

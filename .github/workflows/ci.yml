name: CI

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          set +e
          npm ci > /tmp/ci.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            err=$(head -25 /tmp/ci.log | tr '\n' '|' | cut -c1-700)
            echo "::error file=.github/workflows/ci.yml,line=19::npm ci exit=$code | $err"
            echo "===== FULL npm ci LOG ====="
            cat /tmp/ci.log
            exit 1
          fi
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
